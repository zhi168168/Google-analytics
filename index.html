<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GA4 Project Analytics</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f4;
      --surface: #ffffff;
      --surface-soft: #edf3ef;
      --text: #18211c;
      --muted: #667169;
      --border: #d9e0da;
      --primary: #176b4d;
      --primary-hover: #10573e;
      --accent: #dcae3f;
      --danger: #b54438;
      --shadow: 0 8px 24px rgba(31, 48, 38, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button, input { font: inherit; }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner, main {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: end;
      gap: 3px;
      padding: 5px;
      background: var(--surface-soft);
      border-radius: 6px;
    }

    .brand-mark span {
      display: block;
      background: var(--primary);
      border-radius: 2px 2px 0 0;
    }

    .brand-mark span:nth-child(1) { height: 45%; }
    .brand-mark span:nth-child(2) { height: 75%; background: var(--accent); }
    .brand-mark span:nth-child(3) { height: 100%; }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .controls {
      display: flex;
      align-items: end;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .field {
      display: grid;
      gap: 5px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    input[type="date"] {
      min-height: 38px;
      padding: 7px 10px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
    }

    button {
      min-height: 38px;
      padding: 8px 15px;
      border: 1px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(23, 107, 77, 0.22);
      outline-offset: 2px;
    }

    .primary-button {
      color: #ffffff;
      background: var(--primary);
    }

    .primary-button:hover { background: var(--primary-hover); }
    .primary-button:disabled { opacity: 0.65; cursor: wait; }

    .secondary-button {
      color: var(--text);
      background: var(--surface);
      border-color: var(--border);
    }

    dialog {
      width: min(440px, calc(100% - 28px));
      padding: 0;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 24px 64px rgba(31, 48, 38, 0.22);
    }

    dialog::backdrop { background: rgba(24, 33, 28, 0.42); }

    .dialog-content { padding: 22px; }

    .dialog-content h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
    }

    .dialog-content p {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .dialog-fields {
      display: grid;
      gap: 14px;
    }

    .dialog-fields input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .form-error {
      min-height: 18px;
      margin: 12px 0 0;
      color: var(--danger);
      font-size: 12px;
    }

    main { padding: 30px 0 48px; }

    .page-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .page-heading h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 650;
    }

    .page-heading p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .freshness {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 30px;
    }

    .stat {
      min-height: 112px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
    }

    .stat-value {
      margin-top: 8px;
      font-size: 30px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .stat-context {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .section {
      margin-top: 30px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .section-heading h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
    }

    .section-heading span {
      color: var(--muted);
      font-size: 12px;
    }

    .chart {
      display: grid;
      gap: 10px;
      padding: 20px 0 4px;
      border-top: 1px solid var(--border);
    }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(190px, 280px) 1fr 52px;
      align-items: center;
      gap: 14px;
      min-height: 30px;
    }

    .bar-label {
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    .bar-track {
      height: 12px;
      background: #e3e9e4;
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      min-width: 0;
      background: var(--primary);
      border-radius: 3px;
      transition: width 300ms ease;
    }

    .bar-row:first-child .bar-fill { background: var(--accent); }

    .bar-value {
      text-align: right;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .table-wrap {
      overflow-x: auto;
      border-top: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 13px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    td.number, th.number {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .rank {
      width: 42px;
      color: var(--muted);
    }

    .property-id {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
    }

    .status.error { color: var(--danger); }
    .status.error::before { background: var(--danger); }

    .state {
      min-height: 360px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 14px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    .error-message { color: var(--danger); }
    .hidden { display: none !important; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      .bar-fill { transition: none; }
    }

    @media (max-width: 760px) {
      .topbar-inner, main { width: min(100% - 24px, 1180px); }
      .topbar-inner { align-items: flex-start; flex-direction: column; padding: 16px 0; }
      .controls {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr;
        justify-content: stretch;
      }
      .field { grid-column: 1 / -1; }
      .controls button { width: 100%; }
      input[type="date"] { width: 100%; }
      .page-heading { align-items: flex-start; flex-direction: column; }
      .stats { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 1fr 46px; gap: 8px; }
      .bar-label { font-size: 12px; }
      .bar-track { grid-column: 1 / -1; grid-row: 2; }
      .bar-value { grid-column: 2; grid-row: 1; }
      .property-id { display: none; }
      th:nth-child(3), td:nth-child(3) { display: none; }
    }

    @media (max-width: 460px) {
      .page-heading h2 { font-size: 22px; }
      th, td { padding: 11px 7px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <h1>GA4 Project Analytics</h1>
          <p>多项目活跃用户监控</p>
        </div>
      </div>
      <div class="controls">
        <div class="field">
          <label for="report-date">数据日期</label>
          <input id="report-date" type="date">
        </div>
        <button id="add-project-button" class="secondary-button" type="button">添加项目</button>
        <button id="refresh-button" class="primary-button" type="button">刷新数据</button>
        <button id="export-button" class="secondary-button" type="button" disabled>导出 CSV</button>
      </div>
    </div>
  </header>

  <main>
    <div class="page-heading">
      <div>
        <h2 id="report-title">项目用户概览</h2>
        <p>指标：GA4 活跃用户（Active users）</p>
      </div>
      <div id="freshness" class="freshness"></div>
    </div>

    <div id="loading-state" class="state">
      <div>
        <div class="spinner" aria-hidden="true"></div>
        <div>正在连接 16 个 GA4 项目...</div>
      </div>
    </div>

    <div id="error-state" class="state hidden">
      <div>
        <div id="error-message" class="error-message"></div>
        <button id="retry-button" class="secondary-button" type="button">重新查询</button>
      </div>
    </div>

    <div id="dashboard-content" class="hidden">
      <section class="stats" aria-label="统计摘要">
        <div class="stat">
          <div class="stat-label">总活跃用户</div>
          <div id="total-users" class="stat-value">0</div>
          <div id="total-context" class="stat-context">全部项目合计</div>
        </div>
        <div class="stat">
          <div class="stat-label">有用户的项目</div>
          <div id="active-projects" class="stat-value">0</div>
          <div id="active-context" class="stat-context">共 16 个项目</div>
        </div>
        <div class="stat">
          <div class="stat-label">用户数最高</div>
          <div id="top-users" class="stat-value">0</div>
          <div id="top-project" class="stat-context">-</div>
        </div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h3>项目对比</h3>
          <span>按活跃用户数排序</span>
        </div>
        <div id="chart" class="chart" role="img" aria-label="各项目活跃用户横向条形图"></div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h3>项目明细</h3>
          <span id="table-count"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="rank">排名</th>
                <th>项目</th>
                <th>Property ID</th>
                <th>状态</th>
                <th class="number">活跃用户</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <dialog id="add-project-dialog">
    <form id="add-project-form" class="dialog-content">
      <h2>添加 GA4 项目</h2>
      <p>保存后会加入查询列表。请先在 GA4 为服务账号授予查看者权限。</p>
      <div class="dialog-fields">
        <div class="field">
          <label for="project-name">项目名称</label>
          <input id="project-name" name="project_name" required maxlength="120" autocomplete="off">
        </div>
        <div class="field">
          <label for="property-id">GA4 Property ID</label>
          <input id="property-id" name="property_id" required inputmode="numeric" pattern="[0-9]+" autocomplete="off">
        </div>
      </div>
      <div id="form-error" class="form-error" aria-live="polite"></div>
      <div class="dialog-actions">
        <button id="cancel-add-button" class="secondary-button" type="button">取消</button>
        <button id="save-project-button" class="primary-button" type="submit">保存项目</button>
      </div>
    </form>
  </dialog>

  <script>
    const dateInput = document.getElementById("report-date");
    const refreshButton = document.getElementById("refresh-button");
    const exportButton = document.getElementById("export-button");
    const retryButton = document.getElementById("retry-button");
    const addProjectButton = document.getElementById("add-project-button");
    const addProjectDialog = document.getElementById("add-project-dialog");
    const addProjectForm = document.getElementById("add-project-form");
    const cancelAddButton = document.getElementById("cancel-add-button");
    const saveProjectButton = document.getElementById("save-project-button");
    const formError = document.getElementById("form-error");
    const loadingState = document.getElementById("loading-state");
    const errorState = document.getElementById("error-state");
    const dashboardContent = document.getElementById("dashboard-content");
    let currentReport = null;

    const numberFormat = new Intl.NumberFormat("zh-CN");

    function setLoading(loading) {
      refreshButton.disabled = loading;
      refreshButton.textContent = loading ? "查询中..." : "刷新数据";
      loadingState.classList.toggle("hidden", !loading);
      errorState.classList.add("hidden");
      dashboardContent.classList.toggle("hidden", loading);
    }

    function showError(message) {
      loadingState.classList.add("hidden");
      dashboardContent.classList.add("hidden");
      errorState.classList.remove("hidden");
      document.getElementById("error-message").textContent = message;
      refreshButton.disabled = false;
      refreshButton.textContent = "刷新数据";
    }

    function formatDate(dateText) {
      const [year, month, day] = dateText.split("-");
      return `${year}年${Number(month)}月${Number(day)}日`;
    }

    function renderReport(report) {
      currentReport = report;
      const summary = report.summary;
      const sorted = [...report.projects].sort((a, b) => {
        const aUsers = a.active_users ?? -1;
        const bUsers = b.active_users ?? -1;
        return bUsers - aUsers || a.project_name.localeCompare(b.project_name);
      });

      document.getElementById("report-title").textContent = `${formatDate(report.date)}项目用户概览`;
      document.getElementById("freshness").textContent =
        `更新于 ${new Date(report.generated_at).toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"})}`;
      document.getElementById("total-users").textContent = numberFormat.format(summary.total_users);
      document.getElementById("active-projects").textContent = summary.active_projects;
      document.getElementById("active-context").textContent = `共 ${summary.project_count} 个项目`;
      document.getElementById("top-users").textContent = numberFormat.format(summary.top_project_users);
      document.getElementById("top-project").textContent = summary.top_project;
      document.getElementById("total-context").textContent =
        summary.failed_projects ? `${summary.failed_projects} 个项目查询失败` : "全部项目查询成功";
      document.getElementById("table-count").textContent = `${summary.project_count} 个 Property`;

      const maxUsers = Math.max(...sorted.map(item => item.active_users ?? 0), 1);
      const chart = document.getElementById("chart");
      chart.replaceChildren(...sorted.map(item => {
        const row = document.createElement("div");
        row.className = "bar-row";
        const users = item.active_users ?? 0;
        const width = users === 0 ? 0 : Math.max((users / maxUsers) * 100, 1.5);
        row.innerHTML = `
          <div class="bar-label"></div>
          <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
          <div class="bar-value">${item.status === "success" ? numberFormat.format(users) : "失败"}</div>
        `;
        row.querySelector(".bar-label").textContent = item.project_name;
        return row;
      }));

      const tbody = document.getElementById("table-body");
      tbody.replaceChildren(...sorted.map((item, index) => {
        const tr = document.createElement("tr");
        const isSuccess = item.status === "success";
        tr.innerHTML = `
          <td class="rank">${index + 1}</td>
          <td class="project-name"></td>
          <td class="property-id">${item.property_id}</td>
          <td><span class="status ${isSuccess ? "" : "error"}">${isSuccess ? "成功" : "失败"}</span></td>
          <td class="number">${isSuccess ? numberFormat.format(item.active_users) : "-"}</td>
        `;
        tr.querySelector(".project-name").textContent = item.project_name;
        if (!isSuccess) {
          tr.querySelector(".status").setAttribute("aria-label", `查询失败：${item.error}`);
        }
        return tr;
      }));

      loadingState.classList.add("hidden");
      errorState.classList.add("hidden");
      dashboardContent.classList.remove("hidden");
      refreshButton.disabled = false;
      refreshButton.textContent = "刷新数据";
      exportButton.disabled = false;
    }

    async function loadReport() {
      if (!dateInput.value) return;
      setLoading(true);
      exportButton.disabled = true;
      try {
        const response = await fetch(`/api/report?date=${encodeURIComponent(dateInput.value)}`);
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "数据查询失败");
        renderReport(payload);
      } catch (error) {
        showError(error.message || "无法连接本地数据服务");
      }
    }

    function exportCsv() {
      if (!currentReport) return;
      const rows = [
        ["date", "project_name", "property_id", "active_users", "status"],
        ...currentReport.projects.map(item => [
          currentReport.date,
          item.project_name,
          item.property_id,
          item.active_users ?? "",
          item.status === "success" ? "成功" : item.error,
        ]),
      ];
      const escapeCell = value => `"${String(value).replaceAll('"', '""')}"`;
      const csv = "\uFEFF" + rows.map(row => row.map(escapeCell).join(",")).join("\n");
      const blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `ga4-active-users-${currentReport.date}.csv`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function openAddProjectDialog() {
      formError.textContent = "";
      addProjectForm.reset();
      addProjectDialog.showModal();
      document.getElementById("project-name").focus();
    }

    async function saveProject(event) {
      event.preventDefault();
      formError.textContent = "";
      saveProjectButton.disabled = true;
      saveProjectButton.textContent = "保存中...";

      const formData = new FormData(addProjectForm);
      try {
        const response = await fetch("/api/properties", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            project_name: formData.get("project_name"),
            property_id: formData.get("property_id"),
          }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "保存失败");
        addProjectDialog.close();
        await loadReport();
      } catch (error) {
        formError.textContent = error.message || "保存项目失败";
      } finally {
        saveProjectButton.disabled = false;
        saveProjectButton.textContent = "保存项目";
      }
    }

    async function initialize() {
      try {
        const response = await fetch("/api/config");
        const config = await response.json();
        dateInput.value = config.default_date;
        dateInput.max = config.max_date;
        await loadReport();
      } catch (error) {
        showError("仪表盘初始化失败，请重新启动。");
      }
    }

    refreshButton.addEventListener("click", loadReport);
    retryButton.addEventListener("click", loadReport);
    exportButton.addEventListener("click", exportCsv);
    addProjectButton.addEventListener("click", openAddProjectDialog);
    cancelAddButton.addEventListener("click", () => addProjectDialog.close());
    addProjectForm.addEventListener("submit", saveProject);
    dateInput.addEventListener("change", loadReport);
    initialize();
  </script>
</body>
</html>
